global:
  scrape_interval: 15s
  evaluation_interval: 15s

scrape_configs:
  - job_name: prometheus
    static_configs:
      - targets: ["localhost:9090"]

  - job_name: traefik
    static_configs:
      - targets: ["traefik:80"]
    metrics_path: /metrics

  - job_name: node-exporter
    static_configs:
      - targets: ["node-exporter:9100"]

  - job_name: cadvisor
    static_configs:
      - targets: ["cadvisor:8080"]

  - job_name: forgejo
    metrics_path: /metrics
    static_configs:
      - targets: ["forgejo:3000"]

  # Harbor is installed separately (see deploy/harbor/README.md); once its
  # core service is reachable on the internal network, uncomment:
  # - job_name: harbor
  #   metrics_path: /api/v2.0/metrics
  #   static_configs:
  #     - targets: ["harbor-core:8080"]
